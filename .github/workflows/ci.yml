name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCOVEN_CAVE_AUTHORITY_ROOT: ${{ github.workspace }}/.artifacts/cave-authority
    strategy:
      fail-fast: false
      matrix:
        node: ['24.18.1', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenCoven/coven-cave
          ref: 6325fc4c1154c7d7398074a9760a2e2dc323b424
          path: .artifacts/cave-authority
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The frozen runtime exercises the complete local verification contract.
      - name: Verify exact release runtime
        if: matrix.node == '24.18.1'
        run: corepack pnpm@10.34.0 verify
      # The moving major validates supported package behavior without claiming
      # exact release, conformance, provenance, or environment authority.
      - name: Verify Node 24 package compatibility
        if: matrix.node == '24.x'
        run: corepack pnpm@10.34.0 verify:compat
