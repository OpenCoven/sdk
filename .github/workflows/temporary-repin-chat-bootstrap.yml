name: Temporary Chat bootstrap authority repin

on:
  push:
    branches:
      - fix/repin-chat-bootstrap-authority

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch exact merged Chat workflow
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/OpenCoven/chat/fa2f9bfeca25a5d9a91660448d18c062ca22a14d/.github/workflows/client-v1-conformance.yml' \
            --output .tmp-client-v1-conformance.yml
      - name: Repin authority and validator semantics
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { parseReleaseWorkflowDocument } from './scripts/release-readiness.mjs';

          const oldAuthority = {
            commit: 'a57cc2669aaa0383e46589dbf5ed13ea994eac48',
            tree: '4612ef136ba21bfae553edf6de49234ed2d267aa',
            workflowSize: 442822,
            workflowSha256: '79a73b778b04f47467d243e6bfb5e556f5f61a4cab9aee004c7b5e3f7595c9dc',
            windowsBootstrapSha256: '033500c97f4c5b5a01e45c3d309543ccb384705b8591b11fca9a1aea113ec27d',
          };
          const newAuthority = {
            commit: 'fa2f9bfeca25a5d9a91660448d18c062ca22a14d',
            tree: 'a9e119f5ab526ec377236d48337ac4860308afd1',
            workflowSize: 442868,
            workflowSha256: '6c3fcc8f0c9b34c918b241597cf97cc25a5e31fef991e1f915d71ea7a85b06cb',
          };
          const sha256 = (value) => createHash('sha256').update(value).digest('hex');
          const workflowBytes = readFileSync('.tmp-client-v1-conformance.yml');
          if (
            workflowBytes.byteLength !== newAuthority.workflowSize
            || sha256(workflowBytes) !== newAuthority.workflowSha256
          ) {
            throw new Error('Merged Chat workflow bytes do not match the reviewed #58 authority.');
          }
          const workflow = parseReleaseWorkflowDocument(workflowBytes.toString('utf8'));
          const platformSteps = workflow.jobs?.['platform-conformance']?.steps;
          if (!Array.isArray(platformSteps)) {
            throw new Error('Merged Chat workflow is missing platform-conformance steps.');
          }
          const step = (name) => {
            const matches = platformSteps.filter((candidate) => candidate?.name === name);
            if (matches.length !== 1 || typeof matches[0].run !== 'string') {
              throw new Error(`Merged Chat workflow must contain exactly one ${name} run step.`);
            }
            return matches[0];
          };
          const windowsBootstrap = step('Bootstrap supervised Windows conformance');
          const frozenToolchain = step('Require frozen toolchain');
          const windowsBootstrapSha256 = sha256(windowsBootstrap.run);
          if (
            windowsBootstrapSha256 === oldAuthority.windowsBootstrapSha256
            || !windowsBootstrap.run.includes('if ($item -is [IO.FileInfo])')
            || !windowsBootstrap.run.includes('$item = $item.Directory')
          ) {
            throw new Error('Merged Chat workflow does not contain the reviewed strict-PowerShell repair.');
          }
          if (
            frozenToolchain.run.includes("['exec', 'tauri', '--version']")
            || !frozenToolchain.run.includes("run('rustc', ['--version'])")
          ) {
            throw new Error('Merged Chat workflow does not defer Tauri verification until after dependency install.');
          }

          const replaceExact = (path, before, after) => {
            const source = readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${path}: expected one exact patch target, found ${count}.`);
            }
            writeFileSync(path, source.replace(before, after));
          };
          replaceExact(
            'scripts/github-conformance-evidence.mjs',
            [
              "    `|| !run('rustc', ['--version']).startsWith('rustc ${toolchain.rustVersion} ')`,",
              "    `|| run('pnpm', ['exec', 'tauri', '--version'])`,",
              "    `!== 'tauri-cli ${toolchain.tauriVersion}')`,",
            ].join('\n'),
            "    `|| !run('rustc', ['--version']).startsWith('rustc ${toolchain.rustVersion} '))`,",
          );
          replaceExact(
            'tests/conformance-gaps.spec.ts',
            String.raw`  '|| !run(\'rustc\', [\'--version\']).startsWith(\'rustc 1.95.0 \')',
          ` + String.raw`  '|| run(\'pnpm\', [\'exec\', \'tauri\', \'--version\'])',
          ` + String.raw`  '!== \'tauri-cli 2.11.4\')',`,
            String.raw`  '|| !run(\'rustc\', [\'--version\']).startsWith(\'rustc 1.95.0 \'))',`,
          );

          const lockPath = 'conformance/client-v1-cross-repository-lock.json';
          const lock = JSON.parse(readFileSync(lockPath, 'utf8'));
          const producer = lock.evidenceProducer;
          if (
            producer?.commit !== oldAuthority.commit
            || producer?.tree !== oldAuthority.tree
            || producer?.workflow?.size !== oldAuthority.workflowSize
            || producer?.workflow?.sha256 !== oldAuthority.workflowSha256
            || producer?.workflow?.windowsBootstrapScriptSha256
              !== oldAuthority.windowsBootstrapSha256
          ) {
            throw new Error('SDK producer lock is not at the expected pre-repin authority.');
          }
          producer.commit = newAuthority.commit;
          producer.tree = newAuthority.tree;
          producer.workflow.size = newAuthority.workflowSize;
          producer.workflow.sha256 = newAuthority.workflowSha256;
          producer.workflow.windowsBootstrapScriptSha256 = windowsBootstrapSha256;
          producer.workflow.signerDigest = newAuthority.commit;
          producer.workflow.sourceDigest = newAuthority.commit;
          writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);

          const authorityPaths = [
            'RELEASING.md',
            'docs/workflows/client-v1-cross-repository-conformance.md',
            'tests/conformance-contract.spec.ts',
            'tests/conformance-gaps.spec.ts',
          ];
          const replacements = [
            [oldAuthority.commit, newAuthority.commit],
            [oldAuthority.tree, newAuthority.tree],
            [oldAuthority.workflowSha256, newAuthority.workflowSha256],
            [oldAuthority.windowsBootstrapSha256, windowsBootstrapSha256],
            ['442_822', '442_868'],
            ['442,822', '442,868'],
            ['442822', '442868'],
          ];
          for (const path of authorityPaths) {
            let source = readFileSync(path, 'utf8');
            for (const [before, after] of replacements) {
              source = source.replaceAll(before, after);
            }
            writeFileSync(path, source);
          }

          console.log(JSON.stringify({
            producerCommit: newAuthority.commit,
            producerTree: newAuthority.tree,
            workflowSize: newAuthority.workflowSize,
            workflowSha256: newAuthority.workflowSha256,
            windowsBootstrapSha256,
          }, null, 2));
          NODE
          rm .tmp-client-v1-conformance.yml
      - name: Reject stale producer authority
        run: |
          stale=0
          for value in \
            a57cc2669aaa0383e46589dbf5ed13ea994eac48 \
            4612ef136ba21bfae553edf6de49234ed2d267aa \
            79a73b778b04f47467d243e6bfb5e556f5f61a4cab9aee004c7b5e3f7595c9dc \
            033500c97f4c5b5a01e45c3d309543ccb384705b8591b11fca9a1aea113ec27d
          do
            if git grep -n --fixed-strings "$value" -- . ':!.github/workflows/temporary-repin-chat-bootstrap.yml'; then
              stale=1
            fi
          done
          test "$stale" -eq 0
      - name: Verify focused conformance contract
        run: |
          pnpm typecheck
          pnpm test:conformance-contract
          pnpm lint
      - name: Commit verified repin and retire temporary workflow
        run: |
          git rm .github/workflows/temporary-repin-chat-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            RELEASING.md \
            conformance/client-v1-cross-repository-lock.json \
            docs/workflows/client-v1-cross-repository-conformance.md \
            scripts/github-conformance-evidence.mjs \
            tests/conformance-contract.spec.ts \
            tests/conformance-gaps.spec.ts
          git diff --cached --check
          git commit -m 'fix(conformance): repin merged Chat bootstrap authority'
          git push origin HEAD:${{ github.ref_name }}
