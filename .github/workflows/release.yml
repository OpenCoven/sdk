name: release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Create reviewable candidate bytes or publish reviewed bytes
        required: true
        type: choice
        options:
          - verify
          - publish
      version:
        description: Exact fixed SDK version
        required: true
        type: string
      security-review-comment-id:
        description: Immutable #40 SHIP record; required only for publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: read
      issues: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      OPENCOVEN_CAVE_AUTHORITY_ROOT: ${{ github.workspace }}/.artifacts/cave-authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require frozen Node runtime
        run: |
          expected="v$(cat .node-version)"
          if [ "$expected" != "v24.18.1" ] || [ "$(node --version)" != "$expected" ]; then
            echo "Release verification requires exact Node $expected." >&2
            exit 1
          fi
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must run from main." >&2
          exit 1
      - name: Pin reviewed release runtime
        run: |
          aggregate_record="$(node -e 'const c=require("./release.config.json"); process.stdout.write(c.conformanceEvidence.aggregateRecord ?? "")')"
          candidate_commit="$(node -e 'const c=require("./release.config.json"); process.stdout.write(c.conformanceEvidence.candidateCommit)')"
          if [ -z "$aggregate_record" ]; then
            echo "release.config.json must name a passing SDK #38 aggregate record" >&2
            exit 1
          fi
          expected_record="docs/client-v1-cross-repository-results/$candidate_commit.json"
          if [ "$aggregate_record" != "$expected_record" ]; then
            echo "release.config.json names a non-canonical aggregate record" >&2
            exit 1
          fi
          index_record="${aggregate_record%.json}.index.json"
          git ls-files --error-unmatch \
            .npmrc \
            release.config.json \
            "$aggregate_record" \
            "$index_record" >/dev/null
          git diff --quiet HEAD -- \
            .npmrc \
            release.config.json \
            "$aggregate_record" \
            "$index_record"
          validator_commit="$(node -e 'const fs=require("node:fs"); const p=process.argv[1]; const v=JSON.parse(fs.readFileSync(p,"utf8")).validator?.commit; if(!/^[0-9a-f]{40}$/.test(v??"")) process.exit(1); process.stdout.write(v)' "$aggregate_record")"
          git cat-file -e "$validator_commit^{commit}"
          runtime_paths=(
            .node-version
            .npmrc
            .github/workflows/release.yml
            conformance/release-artifact-manifest.schema.json
            package.json
            pnpm-lock.yaml
            scripts/aggregate-client-v1-conformance.mjs
            scripts/conformance-contract.mjs
            scripts/create-release-artifacts.mjs
            scripts/github-conformance-evidence.mjs
            scripts/github-release-authorization.mjs
            scripts/owned-temp-directory.mjs
            scripts/package-artifacts.mjs
            scripts/publish-release-artifacts.mjs
            scripts/release-readiness.mjs
            scripts/repository-metadata.mjs
            scripts/verify-committed-conformance-evidence.mjs
            scripts/verify-release-readiness.mjs
          )
          git diff --quiet "$validator_commit" HEAD -- "${runtime_paths[@]}"
          git diff --quiet HEAD -- "${runtime_paths[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenCoven/coven-cave
          ref: 2a0ff9237e94e652e477b22f60fd6d721b9e6451
          path: .artifacts/cave-authority
          fetch-depth: 1
          persist-credentials: false
      - name: Verify authoritative conformance evidence
        if: inputs.mode == 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node ./scripts/verify-release-readiness.mjs
          --mode verify
          --version "$RELEASE_VERSION"
          --require-conformance-evidence
      - name: Verify publish gates and release tag
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node ./scripts/verify-release-readiness.mjs
          --mode publish
          --version "$RELEASE_VERSION"
          --tag "sdk-v$RELEASE_VERSION"
          --require-tag
          --require-conformance-evidence
      - name: Require clean reviewed tree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "Release verification changed the reviewed tree." >&2
            exit 1
          fi

  repository-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OPENCOVEN_CAVE_AUTHORITY_ROOT: ${{ github.workspace }}/.artifacts/cave-authority
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenCoven/coven-cave
          ref: 2a0ff9237e94e652e477b22f60fd6d721b9e6451
          path: .artifacts/cave-authority
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require frozen Node runtime
        run: |
          expected="v$(cat .node-version)"
          if [ "$expected" != "v24.18.1" ] || [ "$(node --version)" != "$expected" ]; then
            echo "Repository verification requires exact Node $expected." >&2
            exit 1
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: corepack pnpm@10.34.0 verify:repository
      - name: Require clean reviewed tree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short --untracked-files=all
            echo "Repository verification changed the reviewed tree." >&2
            exit 1
          fi

  publication-candidate:
    if: inputs.mode == 'verify'
    needs: [preflight, repository-verification]
    name: publication-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: publication-candidate
    permissions:
      actions: read
      attestations: write
      contents: read
      deployments: read
      id-token: write
      issues: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      OPENCOVEN_CAVE_AUTHORITY_ROOT: ${{ github.workspace }}/.artifacts/cave-authority
      OPENCOVEN_PUBLICATION_ENVIRONMENT: publication-candidate
      OPENCOVEN_PUBLICATION_ARTIFACT_NAME: opencoven-sdk-publication-${{ github.sha }}-${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0
      - name: Require frozen Node runtime
        run: |
          expected="v$(cat .node-version)"
          if [ "$expected" != "v24.18.1" ] || [ "$(node --version)" != "$expected" ]; then
            echo "Publication candidates require exact Node $expected." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenCoven/coven-cave
          ref: 2a0ff9237e94e652e477b22f60fd6d721b9e6451
          path: .artifacts/cave-authority
          fetch-depth: 1
          persist-credentials: false
      - name: Create immutable publication candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node ./scripts/create-release-artifacts.mjs
          --output .artifacts/publication
          --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencoven-sdk-publication-${{ github.sha }}-${{ inputs.version }}
          path: .artifacts/publication
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .artifacts/publication/release-manifest.json
            .artifacts/publication/tarballs/**/*.tgz

  publish:
    if: inputs.mode == 'publish'
    needs: [preflight, repository-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      OPENCOVEN_SECURITY_REVIEW_COMMENT_ID: ${{ inputs.security-review-comment-id }}
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: read
      id-token: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0
      - name: Require frozen Node runtime
        run: |
          expected="v$(cat .node-version)"
          if [ "$expected" != "v24.18.1" ] || [ "$(node --version)" != "$expected" ]; then
            echo "Publication requires exact Node $expected." >&2
            exit 1
          fi
      - name: Resolve exact publication authorization
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node ./scripts/github-release-authorization.mjs
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.authorization.outputs.artifact-name }}
          path: .artifacts/publication
          github-token: ${{ github.token }}
          repository: OpenCoven/sdk
          run-id: ${{ steps.authorization.outputs.run-id }}
      - name: Verify exact reviewed publication bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node ./scripts/github-release-authorization.mjs
          --artifact-root .artifacts/publication
      - name: Publish exact reviewed release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCOVEN_RELEASE_AUTHORIZATION: publish
        run: >-
          node ./scripts/publish-release-artifacts.mjs
          --artifact-root .artifacts/publication
          --version "$RELEASE_VERSION"
