name: apply-cave-hpke-bound-v1

on:
  push:
    branches:
      - security/cave-hpke-bound-v1
    paths:
      - scripts/apply-cave-hpke-bound-v1.mjs
      - .github/workflows/apply-cave-hpke-bound-v1.yml

permissions:
  contents: write

concurrency:
  group: apply-cave-hpke-bound-v1
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/cave-hpke-bound-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Apply asserted source transformations
        run: node scripts/apply-cave-hpke-bound-v1.mjs
      - name: Regenerate the frozen lockfile
        run: pnpm install --lockfile-only
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(cave): bind authenticated requests with HPKE'
          git push origin HEAD:security/cave-hpke-bound-v1
