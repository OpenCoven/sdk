name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENCOVEN_CAVE_AUTHORITY_ROOT: ${{ github.workspace }}/.artifacts/cave-authority
    strategy:
      fail-fast: false
      matrix:
        node: ['24.18.1', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenCoven/coven-cave
          ref: ecdcdcf8a75b62bb912ec48215ae20ab0809a181
          path: .artifacts/cave-authority
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.node == '24.18.1'
        with:
          repository: OpenCoven/coven
          ref: d6afbffde4f815a538f65185c80da2d0ee951d2d
          path: .artifacts/coven-automations-authority
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproduce and verify pinned Automations v1 artifact
        if: matrix.node == '24.18.1'
        env:
          SOURCE_COMMIT: d6afbffde4f815a538f65185c80da2d0ee951d2d
          AUTOMATIONS_ARTIFACT_DIR: ${{ runner.temp }}/coven-automations-v1-contract
        run: |
          set -euo pipefail
          node ./.artifacts/coven-automations-authority/scripts/package-automations-protocol.mjs \
            --output "$AUTOMATIONS_ARTIFACT_DIR"
          printf '%s  %s\n' \
            '76d3831e7b6591e50ee0ee38dc6fd3152433b27e8fd4346fa8e7751e1945445d' \
            "$AUTOMATIONS_ARTIFACT_DIR/manifest.json" | sha256sum --check --strict
          test "$(wc -c < "$AUTOMATIONS_ARTIFACT_DIR/manifest.json")" -eq 3296
          corepack pnpm@10.34.0 canary:automations-v1 -- \
            --archive "$AUTOMATIONS_ARTIFACT_DIR/coven-automations-v1-contract-${SOURCE_COMMIT}.tar.gz" \
            --bundle-sha256 bd0d97ea257d851cfd45338ca56d62d485a75c1911e4bddead53ab2fb722fa1e \
            --source-commit "$SOURCE_COMMIT" \
            --content-sha256 528b900cde6db1dda7e5ae62affa0db30cd56c440e42532d7d00c75504f86e4a
      # The frozen runtime exercises the complete local verification contract.
      - name: Verify exact release runtime
        if: matrix.node == '24.18.1'
        run: corepack pnpm@10.34.0 verify
      # Drives the released daemon, installed from npm at the locked integrity,
      # through the built client: commands, adoption replay, and event resume
      # across a daemon restart. Needs the build that the verify step produced.
      - name: Drive the released Coven v0.4.10 daemon through the SDK
        if: matrix.node == '24.18.1'
        env:
          COVEN_CLI_DIR: ${{ runner.temp }}/coven-cli-0.4.10
        run: |
          set -euo pipefail
          mkdir -p "$COVEN_CLI_DIR"
          cp conformance/automations-v1-daemon/package.json \
            conformance/automations-v1-daemon/package-lock.json "$COVEN_CLI_DIR/"
          npm ci --prefix "$COVEN_CLI_DIR" --ignore-scripts --no-audit --no-fund
          npm audit signatures --prefix "$COVEN_CLI_DIR"
          corepack pnpm@10.34.0 canary:automations-v1-daemon -- \
            --coven "$COVEN_CLI_DIR/node_modules/@opencoven/cli/bin/coven.js" \
            --expect-version 0.4.10
      # The moving major validates supported package behavior without claiming
      # exact release, conformance, provenance, or environment authority.
      - name: Verify Node 24 package compatibility
        if: matrix.node == '24.x'
        run: corepack pnpm@10.34.0 verify:compat

  native-keyring:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify native binding and adapter contracts
        run: >-
          pnpm exec vitest run tests/native-secret-store.spec.ts
          tests/cave-discovery-pairing.spec.ts
          tests/cave-canonical-reads.spec.ts
          tests/cave-hpke-bound-v1.spec.ts
          tests/cave-hpke-downgrade.spec.ts
          tests/cave-managed-native.spec.ts
          tests/cave-managed-native-staged.spec.ts
          tests/coven-discovery.spec.ts
          tests/coven-automations-platforms.spec.ts
          tests/coven-automations.spec.ts
          tests/coven-automations-receipts.spec.ts
          tests/coven-client-types.spec.ts
          tests/health-validation.spec.ts
          tests/client-contract.spec.ts
      - name: Diagnose synthetic Windows lock deletion and permissions
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./tests/fixtures/windows-lock-lifecycle.ps1
